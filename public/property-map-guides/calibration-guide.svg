<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">Map calibration guide</title>
  <desc id="desc">Simple visual showing north, south, east, and west bounds around a parcel map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="320" rx="18" fill="url(#bg)" />
  <rect x="92" y="44" width="416" height="232" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2" />
  <rect x="150" y="80" width="300" height="170" rx="8" fill="#16233d" stroke="#60a5fa" stroke-dasharray="8 6" />
  <text x="300" y="68" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="18">North edge latitude</text>
  <text x="300" y="267" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="18">South edge latitude</text>
  <text x="95" y="170" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="18" transform="rotate(-90 95 170)">West edge longitude</text>
  <text x="505" y="170" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="18" transform="rotate(90 505 170)">East edge longitude</text>
  <circle cx="298" cy="164" r="10" fill="#38bdf8" stroke="#e0f2fe" stroke-width="2" />
  <text x="300" y="298" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="15">Save these once per map for accurate phone pin placement.</text>
</svg>
